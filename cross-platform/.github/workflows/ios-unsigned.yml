name: Build unsigned iPhone test app
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  iphone:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14.0'
          cache: npm
      - run: npm ci
      - run: npm test && npm run typecheck
      - name: Generate iOS project
        run: npx expo prebuild --platform ios --no-install
      - name: Install native pods
        run: npx pod-install ios
      - name: Compile for an iPhone without signing
        shell: bash
        env:
          NODE_ENV: production
        run: |
          set -euo pipefail
          WORKSPACE=$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)
          test -n "$WORKSPACE"
          SCHEME=$(basename "$WORKSPACE" .xcworkspace)
          xcodebuild -workspace "$WORKSPACE" -scheme "$SCHEME" \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' build
      - name: Package the unsigned app
        shell: bash
        run: |
          set -euo pipefail
          APP=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -print -quit)
          test -n "$APP"
          mkdir -p dist/Payload
          cp -R "$APP" dist/Payload/
          cd dist
          zip -qry Diwali-AR-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Diwali-AR-unsigned-iPhone
          path: dist/Diwali-AR-unsigned.ipa
          retention-days: 7
